[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["build", "dist", ".venv", ".venv-build"]
cache_dir = "build/.pytest_cache"

[tool.ruff]
target-version = "py310"
line-length = 120
exclude = ["build", "dist", ".venv", ".venv-build"]

[tool.mypy]
python_version = "3.10"
exclude = "(^|[\\\\/])(build|dist|\\.venv|\\.venv-build)([\\\\/]|$)"
