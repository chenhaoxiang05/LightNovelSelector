name: Windows 持续集成

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Python 与 WinUI 验证
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 检出代码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 配置 Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-runtime.txt
            requirements-dev.txt

      - name: 安装 Python 依赖
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          python -m pip check

      - name: 验证 Python 核心
        shell: pwsh
        run: |
          python -m py_compile lightnovel_classifier.py lightnovel_sidecar.py tools/verify_sidecar.py
          foreach ($file in Get-ChildItem lightnovel_selector,tests -Recurse -Filter *.py) {
            python -m py_compile $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy lightnovel_classifier.py lightnovel_sidecar.py lightnovel_selector tests
          python -m bandit -q -r lightnovel_selector lightnovel_classifier.py lightnovel_sidecar.py
          python -m vulture lightnovel_classifier.py lightnovel_selector tests --min-confidence 80
          python -m pip_audit -r requirements-dev.txt --strict

      - name: 配置 .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"

      - name: 还原 .NET 依赖
        shell: pwsh
        run: |
          dotnet restore native/LightNovelSelector.WinUI.Tests/LightNovelSelector.WinUI.Tests.csproj --locked-mode
          dotnet restore native/LightNovelSelector.WinUI/LightNovelSelector.WinUI.csproj --locked-mode -p:Platform=x64 -p:WindowsPackageType=None

      - name: 执行 C# 单元测试
        run: dotnet test native/LightNovelSelector.WinUI.Tests/LightNovelSelector.WinUI.Tests.csproj -c Release --no-restore --logger "console;verbosity=minimal"

      - name: 构建 WinUI 3
        run: dotnet build native/LightNovelSelector.WinUI/LightNovelSelector.WinUI.csproj -c Release -p:Platform=x64 -p:WindowsPackageType=None --no-restore
