name: 功能建议
description: 提议新的工作流、识别能力或界面改进
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请先描述真实使用场景，而不是只写实现方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明理想操作流程，以及现有功能为什么不足。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方式

  - type: dropdown
    id: area
    attributes:
      label: 涉及范围
      options:
        - 文件识别与分类
        - 文件移动、报告与撤销
        - WinUI 3 界面与交互
        - 设置与自定义规则
        - 安装、更新与打包
        - 文档与开发体验
        - 其他
    validations:
      required: true

  - type: textarea
    id: safety
    attributes:
      label: 文件安全影响
      description: 若功能会改变扫描、移动、覆盖、删除或撤销行为，请说明如何避免误操作。

  - type: checkboxes
    id: confirmation
    attributes:
      label: 提交确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同建议
          required: true
